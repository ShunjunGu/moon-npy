# CI for moon-npy — a Pure MoonBit reader/writer for the NumPy NPY format.
#
# Mirrors the §19 pipeline of docs/spec/acceptance.md (the in-repo spec owner) and
# the local three-gate discipline (fmt / check / test) recorded in AGENTS.md §8,
# then closes the
# cross-language loop that `moon test` alone cannot reach:
#
#   NumPy fixtures -> MoonBit reads -> MoonBit re-emits -> NumPy verifies
#   (np.array_equal + byte-exact), i.e. the first-phase hard goal (§23).
#   MoonBit NPZ output -> NumPy Oracle; WASM GC demo -> Node bridge assertions.
#
# Toolchain is PINNED (§19) so a green run is reproducible against the exact
# Oracle that produced tests/fixtures/expected.json (NumPy 2.3.4 / Python 3.14).
# The example this workflow runs is the same one the README shows (§19 铁律).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The install CDN (cli.moonbitlang.com/binaries/<version>/) keys on the
  # `moonc -v` semver, NOT the `moon version` date string. Verified against the
  # CDN: only 0.10.11+6ff76a5f9 (and the latest/nightly aliases) resolve 200;
  # the date-form 0.1.20260827+d0aaa07 returns 403 (it is a display-only
  # string, never a CDN path). Both binaries/ and cores/ resolve for this pin.
  # This is the exact local toolchain that produced tests/fixtures/expected.json:
  #   moon version -> 0.1.20260827 (d0aaa07 2026-08-27)   [AGENTS.md §0]
  #   moonc -v     -> v0.10.11+6ff76a5f9 (2026-08-28)     [CDN pin below]
  MOONBIT_VERSION: "0.10.11+6ff76a5f9"
  PYTHON_VERSION: "3.14"
  NUMPY_VERSION: "2.3.4"
  NODE_VERSION: "24.11.0"

jobs:
  roundtrip:
    name: fmt / check / test / interop / WASM demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }} (WASM GC verifier)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NumPy (pinned Oracle)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ env.NUMPY_VERSION }}"

      # Official install script; the version is a positional arg (bash -s "<ver>")
      # that pins the exact toolchain. moon lands in $HOME/.moon/bin, which we
      # publish to $GITHUB_PATH so the fresh shell of every later step resolves it.
      - name: Install MoonBit toolchain (pinned)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ env.MOONBIT_VERSION }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # A fresh runner has an EMPTY package-registry index, so `moon check` cannot
      # resolve the moon.mod dependencies (`moonbitlang/x@0.5.1`, plus
      # `amor2025/moonNum@0.1.0` since S6) and fails with
      # "module was not found in the registry". `moon update` git-clones the index
      # from mooncakes.io into $HOME/.moon/registry/index (git is preinstalled on
      # ubuntu-latest). This refreshes ONLY the registry index -- it never touches
      # the pinned toolchain installed above, so reproducibility is preserved.
      - name: Update MoonBit registry index
        run: moon update

      # Traceability: the log records the exact toolchain that produced the run.
      - name: Record toolchain versions
        run: |
          moon version
          moonc -v
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"
          node --version

      # --- Gate 1/3: formatting (AGENTS.md §8). Pinned moon == local moon, so
      # fmt output is identical; a diff means someone committed unformatted code.
      - name: moon fmt (no diff expected)
        run: |
          moon fmt
          git diff --exit-code

      # --- Gate 2/3: type check (§19 "MoonBit Check") ---
      - name: moon check
        run: moon check --target native

      # --- Gate 3/3: unit tests (§19 "MoonBit Unit Tests") ---
      - name: moon test
        run: moon test --target native

      # Coverage gate (§14 / §19 "+coverage"): report the per-file summary AND
      # enforce the two plan thresholds -- core parser (format+lexer+parser) >= 90%
      # and project overall >= 80%. A file absent from `-f summary` is 100%
      # covered, so summing only the listed core files is a conservative lower
      # bound (folding a 100% file into an aggregate can only raise it). The
      # default `bash -e` aborts if any moon step fails; the awk gate exits
      # non-zero if either threshold slips, so this step is now blocking.
      - name: Coverage gate (report + enforce thresholds)
        run: |
          moon test --target native --enable-coverage
          moon coverage analyze
          moon coverage report -f summary > coverage-summary.txt
          cat coverage-summary.txt
          awk '
            function pct(c, t) { return (t == 0) ? 100.0 : (c * 100.0 / t) }
            /^Total:/ { split($2, a, "/"); oc = a[1] + 0; ot = a[2] + 0; seen = 1 }
            /(format|lexer|parser)\.mbt:/ { split($2, a, "/"); cc += a[1]; ct += a[2] }
            END {
              if (!seen) { print "FAIL: no Total line in coverage summary"; exit 1 }
              core = pct(cc, ct); overall = pct(oc, ot)
              printf "core parser (format+lexer+parser): %d/%d = %.1f%%  [threshold 90%%]\n", cc, ct, core
              printf "project overall:                   %d/%d = %.1f%%  [threshold 80%%]\n", oc, ot, overall
              if (core < 90) { print "FAIL: core parser coverage below 90%"; exit 1 }
              if (overall < 80) { print "FAIL: overall coverage below 80%"; exit 1 }
              print "PASS: both coverage thresholds met"
            }
          ' coverage-summary.txt

      # Fixture drift guard: committed .npy + expected.json still match the Oracle.
      - name: Verify NumPy fixtures (no drift)
        run: python interoperability/generate_fixtures.py --check

      # Cross-language byte-exact round-trip (§16 / §29), driven by expected.json:
      #   emit   — `moon run examples/roundtrip` decodes each fixture, re-encodes
      #            it with the Writer, and writes the bytes to disk.
      #   verify — `verify_moonbit_output.py` has NumPy load that file and assert
      #            np.array_equal AND byte-for-byte identity vs the Oracle.
      # No fixture count in the step name: expected.json is the only list, and the
      # script prints "N/N passed" itself (a hardcoded count here would silently
      # go stale every time a fixture is added).
      - name: NumPy -> MoonBit -> NumPy round-trip
        run: python interoperability/roundtrip.py -v

      # N7 savez write direction: `moon run examples/npz_write` decodes fixture
      # .npy files and packs them into an uncompressed .npz via encode_npz; then
      # verify_npz_output.py has the Python Oracle assert what moon test cannot
      # reach -- zipfile.testzip() CRC-32 (acceptance for the self-implemented
      # crc32.mbt), all-members ZIP_STORED with a .npy suffix, np.load readable,
      # and per-member dtype/shape/array_equal vs the source fixtures, in key
      # order. The second pair pins the UTF-8 member key end to end: the stored
      # name must reach np.load as "数据" (GP bit 11), not cp437 mojibake.
      - name: MoonBit -> NumPy npz write (np.savez-compatible)
        run: |
          mkdir -p _build/n7_out
          moon run examples/npz_write --target native -- _build/n7_out/demo.npz \
            tests/fixtures/f4_2x3_c_le_v1.npy \
            tests/fixtures/i4_4_c_le_v1.npy \
            tests/fixtures/u1_4_c_na_v1.npy \
            tests/fixtures/c8_4_c_le_v1.npy
          python interoperability/verify_npz_output.py _build/n7_out/demo.npz \
            --reference f4_2x3_c_le_v1=tests/fixtures/f4_2x3_c_le_v1.npy \
            --reference i4_4_c_le_v1=tests/fixtures/i4_4_c_le_v1.npy \
            --reference u1_4_c_na_v1=tests/fixtures/u1_4_c_na_v1.npy \
            --reference c8_4_c_le_v1=tests/fixtures/c8_4_c_le_v1.npy
          moon run examples/npz_write --target native -- _build/n7_out/utf8.npz \
            "数据=tests/fixtures/f4_2x3_c_le_v1.npy"
          python interoperability/verify_npz_output.py _build/n7_out/utf8.npz \
            --reference "数据=tests/fixtures/f4_2x3_c_le_v1.npy"

      # Build the source used by the browser demo and exercise its exported Int
      # bridge in Node. verify_demo.mjs asserts real reports, zero host imports,
      # malformed-input rejection, and out-of-range access without a trap.
      # The browser loads checked-in embedded data, so regeneration must produce
      # no diff from those assets as well.
      - name: Browser WASM GC demo verifier
        run: |
          moon build --target wasm-gc
          node examples/wasm-demo/verify_demo.mjs \
            _build/wasm-gc/debug/build/examples/wasm-demo/wasm-demo.wasm \
            tests/fixtures/f4_2x3_c_le_v1.npy \
            tests/fixtures/i4_2x3_f_be_v1.npy
          node examples/wasm-demo/embed.mjs \
            _build/wasm-gc/debug/build/examples/wasm-demo/wasm-demo.wasm
          git diff --exit-code -- \
            examples/wasm-demo/wasm-demo-b64.js \
            examples/wasm-demo/samples.js

      # CLI smoke + exit-code discipline (§13) — the README's inspect/validate/dump
      # commands, run for real. `moon run` propagates the child's status, so the
      # extern "c" exit_with is exercised end-to-end: a valid fixture exits 0, a
      # readable non-NPY file (README.md) exits 1 (InvalidMagic), a missing file
      # exits 2. The two non-zero codes must stay distinct (§13 退出码纪律).
      # The dump greps use -F because they pin measured output, not an assumed
      # format: Float to_string drops a trailing ".0", so the complex pair prints
      # as "(1, 2)" and the element rows as "[0] 0" (AGENTS.md §19).
      - name: CLI inspect / validate / dump + exit codes
        run: |
          moon run cmd/main --target native -- inspect tests/fixtures/f4_2x3_c_le_v1.npy
          moon run cmd/main --target native -- validate tests/fixtures/f4_2x3_c_le_v1.npy
          moon run cmd/main --target native -- dump tests/fixtures/f4_2x3_c_le_v1.npy --limit 2 | grep -F "(showing 2 of 6 elements)"
          moon run cmd/main --target native -- dump tests/fixtures/c8_4_c_le_v1.npy | grep -F "(1, 2)"
          set +e
          moon run cmd/main --target native -- validate README.md
          invalid=$?
          moon run cmd/main --target native -- validate does_not_exist.npy
          missing=$?
          moon run cmd/main --target native -- dump tests/fixtures/f4_2x3_c_le_v1.npy --limit x
          bad_limit=$?
          set -e
          test "$invalid" -eq 1
          test "$missing" -eq 2
          test "$bad_limit" -eq 2
